name: desktile
description: "DeskTile 课表岛 —— Windows 与 Android 跨平台课程表"
publish_to: 'none'
version: 1.2.7+12

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # 桌面窗口：无边框 / 贴桌面 / 跳过任务栏 / 拖动
  window_manager: ^0.5.2
  # 托盘图标与菜单
  tray_manager: ^0.5.3
  # 多屏信息，用于挂件首次定位到右下角
  screen_retriever: ^0.2.2
  # 本地通知（含 Windows 实现），早八提醒用
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # 数据文件位置
  path_provider: ^2.1.6
  # 导入导出的文件选择框
  file_picker: ^12.0.0
  # 导入格式
  csv: ^8.0.0
  yaml: ^3.1.3
  icalendar_parser: ^2.1.0
  home_widget: 0.9.3
  flutter_timezone: 5.0.1
  workmanager: ^0.10.9
  # Android / Windows 线上更新检查与安装包下载
  http: ^1.6.0
  # Release 资产 SHA-256 完整性校验
  crypto: ^3.0.7
  # Windows 可执行文件版本读取
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
